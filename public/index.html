<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Time Log</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6f6e68;--line:#e3e1d9;--acc:#2f5d50}
@media(prefers-color-scheme:dark){:root{--bg:#161715;--card:#202220;--ink:#ecebe5;--mute:#9a9990;--line:#33352f;--acc:#7fc4ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
select,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
button{cursor:pointer}
button.ghost{background:none;border:none;color:var(--mute);padding:4px 8px}
.date{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.date strong{font-size:17px;text-align:center;flex:1}
label small{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.mute{color:var(--mute)}
input[type=color]{padding:0;width:36px;height:36px}
.slot{display:grid;grid-template-columns:84px 112px 1fr;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:none}
.slot .tm{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.slot select{padding:6px 4px;font-size:14px;border-left-width:6px;min-width:0}
.slot input{padding:6px 8px;font-size:14px;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.chart{display:flex;gap:2px;align-items:stretch;height:100px;margin:12px 0 4px}
.chart .col{flex:1;display:flex;flex-direction:column-reverse;min-width:0}
.chart .col div{width:100%}
.xl{display:flex;gap:2px;font-size:10px;color:var(--mute);margin-bottom:10px}
.xl span{flex:1;text-align:center;overflow:hidden}
.pct{width:44px;text-align:right}
@media(max-width:420px){.slot{grid-template-columns:70px 1fr;}.slot input{grid-column:1/-1}.slot .tm{font-size:12px}}
</style>
</head>
<body>
<main>
  <h1>Daily Time Log</h1>

  <div class="date">
    <button id="prev" aria-label="Previous day">‹</button>
    <strong id="dateLabel"></strong>
    <button id="next" aria-label="Next day">›</button>
  </div>

  <div class="card">
    <div class="row">
      <label class="grow"><small>From</small><select id="from" style="width:100%"></select></label>
      <label class="grow"><small>To</small><select id="to" style="width:100%"></select></label>
    </div>
  </div>

  <div class="card">
    <div id="bar" class="bar"></div>
    <div id="sums"></div>
  </div>

  <div class="card" id="grid"></div>

  <div class="card">
    <h2>Review</h2>
    <div class="tabs" id="tabs"></div>
    <div class="date" style="margin-bottom:0">
      <button id="rprev" aria-label="Previous period">‹</button>
      <strong id="rlabel"></strong>
      <button id="rnext" aria-label="Next period">›</button>
    </div>
    <div class="chart" id="chart"></div>
    <div class="xl" id="xl"></div>
    <div id="rsums"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Labels</h2>
      <button class="ghost" id="toggleLabels">Edit</button>
    </div>
    <div id="labelEditor" hidden style="margin-top:10px"></div>
  </div>
</main>

<script>
(function(){
  var KEY='daily-time-log-v1';
  var DEFAULT_LABELS=[
    {id:'l1',name:'Work',color:'#2f5d50'},
    {id:'l2',name:'Study',color:'#3b6ea5'},
    {id:'l3',name:'Exercise',color:'#d98324'},
    {id:'l4',name:'Rest',color:'#8a6bb0'},
    {id:'l5',name:'Other',color:'#8d8c85'}
  ];
  var state=load();
  var current=today();
  var editing=false;

  function load(){
    var s=null;
    try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
    if(!s||!s.labels)s={labels:DEFAULT_LABELS.slice()};
    if(!s.slots)s.slots={};
    if(!s.win)s.win={from:360,to:1320};
    // migrate entries from the earlier version
    if(s.entries){
      s.entries.forEach(function(x){
        var d=s.slots[x.date]=s.slots[x.date]||{};
        for(var m=x.start;m<x.end;m+=15)d[m]={l:x.label,n:''};
      });
      delete s.entries;
    }
    return s;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function pad(n){return n<10?'0'+n:''+n;}
  function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function shift(ds,n){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
  function dur(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m';}
  function $(id){return document.getElementById(id);}
  function labelById(id){for(var i=0;i<state.labels.length;i++)if(state.labels[i].id===id)return state.labels[i];return null;}
  function el(tag,props,kids){var e=document.createElement(tag);for(var k in props||{})e[k]=props[k];(kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
  function day(){return state.slots[current]||(state.slots[current]={});}

  function fillWindow(){
    var f=$('from'),t=$('to');f.innerHTML='';t.innerHTML='';
    for(var m=0;m<=1440;m+=15){
      if(m<1440)f.appendChild(el('option',{value:m,textContent:fmt(m)}));
      if(m>0)t.appendChild(el('option',{value:m,textContent:fmt(m)}));
    }
    f.value=state.win.from;t.value=state.win.to;
  }
  function onWindow(){
    var a=+$('from').value,b=+$('to').value;
    if(b<=a){b=Math.min(a+15,1440);$('to').value=b;if(b<=a){a=b-15;$('from').value=a;}}
    state.win={from:a,to:b};save();renderGrid();
  }

  function applyColor(sel){
    var l=labelById(sel.value);
    sel.style.borderLeftColor=l?l.color:'var(--line)';
  }

  function renderGrid(){
    var g=$('grid');g.innerHTML='';
    var d=state.slots[current]||{};
    for(var m=state.win.from;m<state.win.to;m+=15){
      (function(m){
        var s=d[m]||{};
        var sel=el('select');
        sel.appendChild(el('option',{value:'',textContent:'—'}));
        state.labels.forEach(function(l){sel.appendChild(el('option',{value:l.id,textContent:l.name}));});
        sel.value=labelById(s.l)?s.l:'';
        applyColor(sel);
        var note=el('input',{type:'text',placeholder:'What did you do?',value:s.n||''});
        function commit(){
          var cur=day()[m]||{};
          cur.l=sel.value;cur.n=note.value;
          if(!cur.l&&!cur.n)delete day()[m];else day()[m]=cur;
          save();renderSummary();
        }
        sel.onchange=function(){applyColor(sel);commit();};
        note.oninput=commit;
        g.appendChild(el('div',{className:'slot'},[el('span',{className:'tm',textContent:fmt(m)+'–'+fmt(m+15)}),sel,note]));
      })(m);
    }
    renderSummary();
  }

  function renderSummary(){
    var d=state.slots[current]||{},totals={},sum=0;
    Object.keys(d).forEach(function(m){
      if(+m<state.win.from||+m>=state.win.to)return;
      var l=d[m].l;if(!l||!labelById(l))return;
      totals[l]=(totals[l]||0)+15;sum+=15;
    });
    var span=state.win.to-state.win.from;
    var bar=$('bar');bar.innerHTML='';var sums=$('sums');sums.innerHTML='';
    state.labels.forEach(function(l){
      if(!totals[l.id])return;
      var seg=el('div');seg.style.width=(totals[l.id]/span*100)+'%';seg.style.background=l.color;bar.appendChild(seg);
      var dot=el('span',{className:'dot'});dot.style.background=l.color;
      sums.appendChild(el('div',{className:'sum'},[el('span',{},[dot,l.name]),el('span',{className:'mute',textContent:dur(totals[l.id])})]));
    });
    sums.appendChild(el('div',{className:'sum'},[el('b',{textContent:'Labeled'}),el('b',{textContent:dur(sum)+' of '+dur(span)})]));
    renderReview();
  }

  var rvMode='week',rvDate=today();
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parse(ds){var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function period(){
    var d=parse(rvDate),y=d.getFullYear(),mo=d.getMonth(),a,b,buckets=[],title;
    if(rvMode==='week'){
      var s=new Date(y,mo,d.getDate()-((d.getDay()+6)%7));
      for(var i=0;i<7;i++){var x=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);buckets.push({k:iso(x),l:'MTWTFSS'.charAt(i)});}
      var e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);
      title=MON[s.getMonth()]+' '+s.getDate()+' – '+MON[e.getMonth()]+' '+e.getDate()+', '+e.getFullYear();
    }else if(rvMode==='month'){
      var n=new Date(y,mo+1,0).getDate();
      for(var j=1;j<=n;j++)buckets.push({k:y+'-'+pad(mo+1)+'-'+pad(j),l:''+j});
      title=MON[mo]+' '+y;
    }else{
      for(var q=0;q<12;q++)buckets.push({k:y+'-'+pad(q+1),l:MON[q].charAt(0)});
      title=''+y;
    }
    return {buckets:buckets,title:title,prefixLen:rvMode==='year'?7:10};
  }
  function renderReview(){
    var tabs=$('tabs');tabs.innerHTML='';
    ['week','month','year'].forEach(function(m){
      var b=el('button',{textContent:m.charAt(0).toUpperCase()+m.slice(1),className:rvMode===m?'on':''});
      b.onclick=function(){rvMode=m;renderReview();};tabs.appendChild(b);
    });
    var p=period();$('rlabel').textContent=p.title;
    var idx={},data=p.buckets.map(function(b,i){idx[b.k]=i;return {};});
    var totals={},sum=0;
    Object.keys(state.slots).forEach(function(dt){
      var i=idx[dt.slice(0,p.prefixLen)];if(i===undefined)return;
      var d=state.slots[dt];
      Object.keys(d).forEach(function(m){
        var l=d[m].l;if(!l||!labelById(l))return;
        data[i][l]=(data[i][l]||0)+15;totals[l]=(totals[l]||0)+15;sum+=15;
      });
    });
    var max=0;
    data.forEach(function(d){var t=0;for(var k in d)t+=d[k];if(t>max)max=t;});
    var chart=$('chart'),xl=$('xl');chart.innerHTML='';xl.innerHTML='';
    data.forEach(function(d,i){
      var col=el('div',{className:'col'});
      state.labels.forEach(function(l){
        if(!d[l.id])return;
        var seg=el('div');seg.style.height=(d[l.id]/max*100)+'%';seg.style.background=l.color;col.appendChild(seg);
      });
      chart.appendChild(col);
      xl.appendChild(el('span',{textContent:p.buckets[i].l}));
    });
    var rs=$('rsums');rs.innerHTML='';
    if(!sum){rs.appendChild(el('div',{className:'mute',textContent:'Nothing labeled in this period.'}));return;}
    state.labels.slice().sort(function(a,b){return (totals[b.id]||0)-(totals[a.id]||0);}).forEach(function(l){
      if(!totals[l.id])return;
      var dot=el('span',{className:'dot'});dot.style.background=l.color;
      rs.appendChild(el('div',{className:'sum'},[
        el('span',{style:'flex:1'},[dot,l.name]),
        el('span',{className:'mute',textContent:dur(totals[l.id])}),
        el('span',{className:'mute pct',textContent:Math.round(totals[l.id]/sum*100)+'%'})
      ]));
    });
    rs.appendChild(el('div',{className:'sum'},[el('b',{textContent:'Total'}),el('b',{textContent:dur(sum)})]));
  }
  function rvShift(n){
    var d=parse(rvDate);
    if(rvMode==='week')d.setDate(d.getDate()+7*n);
    else if(rvMode==='month')d=new Date(d.getFullYear(),d.getMonth()+n,1);
    else d=new Date(d.getFullYear()+n,0,1);
    rvDate=iso(d);renderReview();
  }

  function renderDate(){
    var d=new Date(current+'T00:00:00');
    var label=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    $('dateLabel').textContent=current===today()?'Today · '+label:label;
  }

  function renderEditor(){
    var box=$('labelEditor');box.hidden=!editing;$('toggleLabels').textContent=editing?'Done':'Edit';
    if(!editing)return;
    box.innerHTML='';
    state.labels.forEach(function(l){
      var color=el('input',{type:'color',value:l.color});
      color.onchange=function(){l.color=color.value;save();renderGrid();};
      var name=el('input',{type:'text',value:l.name,className:'grow'});
      name.onchange=function(){l.name=name.value.trim()||l.name;save();renderGrid();};
      var del=el('button',{className:'ghost',textContent:'✕',title:'Delete label'});
      del.disabled=state.labels.length<2;
      del.onclick=function(){
        state.labels=state.labels.filter(function(y){return y.id!==l.id;});
        Object.keys(state.slots).forEach(function(dt){Object.keys(state.slots[dt]).forEach(function(m){
          var s=state.slots[dt][m];if(s.l===l.id){s.l='';if(!s.n)delete state.slots[dt][m];}
        });});
        save();renderEditor();renderGrid();
      };
      box.appendChild(el('div',{className:'row',style:'margin-bottom:8px'},[color,name,del]));
    });
    var nc=el('input',{type:'color',value:'#c4527a'});
    var nn=el('input',{type:'text',placeholder:'New label',className:'grow'});
    var add=el('button',{textContent:'Add'});
    add.onclick=function(){var n=nn.value.trim();if(!n)return;state.labels.push({id:uid(),name:n,color:nc.value});save();renderEditor();renderGrid();};
    box.appendChild(el('div',{className:'row'},[nc,nn,add]));
  }

  function go(n){current=shift(current,n);renderDate();renderGrid();}
  $('prev').onclick=function(){go(-1);};
  $('next').onclick=function(){go(1);};
  $('rprev').onclick=function(){rvShift(-1);};
  $('rnext').onclick=function(){rvShift(1);};
  $('from').onchange=$('to').onchange=onWindow;
  $('toggleLabels').onclick=function(){editing=!editing;renderEditor();};

  fillWindow();renderDate();renderGrid();renderEditor();
})();
</script>
</body>
</html>
